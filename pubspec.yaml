name: highschool_assam
description: "An educational app for high school students in Assam with 30-day trial and secure device locking."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  device_info_plus: ^10.1.0
  cached_network_image: ^3.4.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

